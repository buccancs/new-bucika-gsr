plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}
kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}
android {
    namespace = "com.topdon.component.edit3d"
    compileSdk = rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk = rootProject.ext.android.minSdk
        targetSdk = rootProject.ext.android.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs', 'src/main/jnilibs']
        }
    }

    flavorDimensions 'app'
    productFlavors {
        dev {
            dimension 'app'
        }
        beta {
            dimension 'app'
        }
        prod {
            dimension 'app'
        }
        prodTopdon {
            dimension 'app'
        }
        insideChina {
            dimension 'app'
        }
        prodTopdonInsideChina {
            dimension 'app'
        }
    }
}

dependencies {
    // ARouter and other optional dependencies commented out for core functionality
    // ARouter and other optional dependencies commented out for core functionality
    // kapt 'com.alibaba:arouter-compiler:1.5.2'
    implementation project(':android:libapp')
    implementation project(':android:libui') //需要使用 BarPickView
    implementation(name: 'opengl_1.3.2_standard', ext: 'aar')

}