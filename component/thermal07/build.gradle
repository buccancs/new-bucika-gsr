plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}

kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
    }
}

android {
    namespace = 'com.topdon.thermal07'
    compileSdk = rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk = rootProject.ext.android.minSdk
        targetSdk = rootProject.ext.android.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures{
        dataBinding = true
    }

    flavorDimensions 'app'
    productFlavors {
        dev {
            dimension 'app'
        }
        beta {
            dimension 'app'
        }
        prod {
            dimension 'app'
        }
        prodTopdon {
            dimension 'app'
        }
        insideChina {
            dimension 'app'
        }
        prodTopdonInsideChina {
            dimension 'app'
        }
    }
}

dependencies {
    implementation project(':android:libapp')
    implementation project(':libcom')
    implementation project(':android:libir')
    implementation project(':libmenu')
    implementation project(':android:libui')
    implementation project(':component:pseudo')
    implementation project(':component:thermal-ir')
    implementation project(':component:thermal04')

    // ARouter and other optional dependencies commented out for core functionality
    // ARouter and other optional dependencies commented out for core functionality
    // kapt 'com.alibaba:arouter-compiler:1.5.2'

    //艾睿手持设备API接口SDK
    api(name: 'jetified-tas_api-1.0.4.0', ext: 'aar')
}