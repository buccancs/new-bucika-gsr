// BucikaGSR Signing Configuration
// Extracted from main build.gradle to improve maintainability

android {
    signingConfigs {
        // Debug builds will use Android's default debug keystore automatically
        // No custom debug configuration needed
        
        release {
            // Only configure release signing if keystore exists
            def keystoreFile = file('artibox_key/ArtiBox.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                keyAlias 'Artibox'
                storePassword 'artibox2017'
                keyPassword 'artibox2017'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
}