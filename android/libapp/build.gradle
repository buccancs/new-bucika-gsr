    api "com.airbnb.android:lottie:6.1.0"

    // RecyclerView and refresh layout
    api "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.7"
    api "com.scwang.smartrefresh:SmartRefreshLayout:1.1.3"
    api "com.scwang.smartrefresh:SmartRefreshHeader:1.1.3"

    // HTTP and UI - removing problematic dependencies
    api "com.squareup.okhttp3:logging-interceptor:4.9.1"
    api "com.github.skydoves:colorpickerview:2.2.4"
